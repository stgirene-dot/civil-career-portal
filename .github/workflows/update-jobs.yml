name: Update career opportunities

on:
  schedule:
    # Run at the start of every hour (UTC).
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: Send a test email even when no new jobs are found
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official job sources
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          python scripts/update_jobs.py
      - name: Notify subscribers about new jobs
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATION_RECIPIENTS: ${{ secrets.NOTIFICATION_RECIPIENTS }}
          SEND_TEST_NOTIFICATION: ${{ github.event.inputs.send_test_notification || 'false' }}
        run: python scripts/send_notifications.py
      - name: Commit updated job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/update-meta.json
          git diff --cached --quiet || git commit -m "Update career opportunities"
          git push
